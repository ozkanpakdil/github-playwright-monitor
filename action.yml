name: 'Playwright Resource Monitor'
description: >-
  Two-layer resource guard for Playwright CI runs: machine-wide CPU/memory
  thresholds from monocart-reporter's built-in sampler, plus per-tab (renderer
  process) CPU/memory thresholds from its own /proc scanner (CDP optional).
  Fails the step when any configured threshold is exceeded.
author: 'playwright-resource-monitor contributors'

branding:
  icon: 'activity'
  color: 'blue'

inputs:
  run-command:
    description: 'The test command to execute and monitor (run in a shell).'
    required: false
    default: 'npx playwright test'
  machine-cpu-threshold:
    description: 'Max machine-wide CPU usage, % of all cores combined (from the monocart report).'
    required: false
    default: '70'
  machine-memory-threshold:
    description: 'Max machine-wide memory usage, % of total RAM (from the monocart report).'
    required: false
    default: '70'
  tab-cpu-threshold:
    description: 'Max CPU for the worst single tab (renderer process), % of one core.'
    required: false
    default: '70'
  tab-memory-threshold:
    description: 'Max memory for the worst single tab, % of the effective RAM limit (cgroup limit if present, else total RAM).'
    required: false
    default: '70'
  polling-interval:
    description: 'How often, in seconds, the tab sampler polls (0.5–60). Machine-wide sampling cadence is monocart''s tickTime.'
    required: false
    default: '2'
  cdp-port:
    description: 'Opt-in: debug port to poll for precise per-tab labeling via Chrome DevTools Protocol. Empty = /proc scanner only (Linux).'
    required: false
    default: ''
  monocart-json:
    description: 'Path to the monocart-reporter JSON data file (json option, default location shown).'
    required: false
    default: 'monocart-report/index.json'
  report-dir:
    description: 'Directory (relative to the workspace) where the per-tab JSON/CSV reports are written.'
    required: false
    default: 'resource-monitor'
  history-file:
    description: 'File (relative to the workspace) where the per-run summary history is kept. Persist it with actions/cache for cross-run trends.'
    required: false
    default: 'resource-monitor/history.json'
  history-max-entries:
    description: 'Maximum run records kept in the history file (1–1000).'
    required: false
    default: '50'
  fail-on-breach:
    description: 'When true (default), any threshold breach (machine or tab) fails the step. When false, breaches only warn.'
    required: false
    default: 'true'

outputs:
  peak-machine-cpu-percent:
    description: 'Highest machine-wide CPU during the run (% of all cores, from the monocart report).'
  peak-machine-memory-percent:
    description: 'Highest machine-wide memory during the run (% of total RAM, from the monocart report).'
  machine-breach-count:
    description: 'Number of machine-wide samples that breached a threshold.'
  peak-tab-cpu-percent:
    description: 'Highest CPU observed on any single tab (% of one core). Empty when no tab samples.'
  peak-tab-memory-percent:
    description: 'Highest memory observed on any single tab (% of effective RAM limit). Empty when no tab samples.'
  tab-breach-count:
    description: 'Number of per-tab samples that breached a threshold.'
  tab-sample-count:
    description: 'Number of tab samples collected.'
  tab-source:
    description: '"cdp" or "proc" — the sampler that produced tab metrics; "none" when no samples.'
  monocart-found:
    description: '"true" when the monocart JSON was found and parsed.'
  report-json-path:
    description: 'Absolute path to the per-tab JSON report (resource-monitor/report.json).'

runs:
  using: 'node20'
  main: 'dist/index.js'