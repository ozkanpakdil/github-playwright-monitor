name: 'Playwright Resource Monitor'
description: >-
  Monitors machine CPU and memory usage while Playwright tests run, powered by
  the built-in sampler of monocart-reporter. Fails the step when usage exceeds
  the configured thresholds (70% by default) and links to the monocart report
  timeline.
author: 'playwright-resource-monitor contributors'

branding:
  icon: 'activity'
  color: 'blue'

inputs:
  run-command:
    description: 'The test command to execute and monitor (run in a shell).'
    required: false
    default: 'npx playwright test'
  cpu-threshold:
    description: 'Max machine-wide CPU usage, % of all cores combined (monocart sampler). Fails when exceeded.'
    required: false
    default: '70'
  memory-threshold:
    description: 'Max machine memory usage, % of total RAM. Fails when exceeded.'
    required: false
    default: '70'
  monocart-json:
    description: 'Path to the monocart-reporter JSON data file (produced with the json: true reporter option).'
    required: false
    default: 'monocart-report/index.json'
  fail-on-breach:
    description: 'When true (default), a threshold breach fails the step. When false, breaches only warn.'
    required: false
    default: 'true'

outputs:
  peak-cpu-percent:
    description: 'Highest machine-wide CPU usage observed during the run (% of all cores).'
  peak-memory-percent:
    description: 'Highest machine memory usage observed during the run (% of total RAM).'
  breach-count:
    description: 'Number of samples that breached a threshold.'
  sample-count:
    description: 'Number of samples in the monocart report.'
  report-found:
    description: '"true" when the monocart JSON data file was found and parsed.'

runs:
  using: 'node20'
  main: 'dist/index.js'