name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bunx tsc --noEmit

      - name: Unit tests
        run: bun test

      - name: Build dist
        run: bun run build

      - name: Verify committed dist is fresh
        run: |
          git diff --exit-code dist/index.js || {
            echo "::error::dist/index.js is stale — run 'bun run build' and commit the result."
            exit 1
          }

      - name: Pass-through smoke (no Playwright — must stay silent and green)
        uses: ./
        with:
          run-command: echo smoke
          polling-interval: 0.5

  # Pre-release validation: run the action around a REAL Playwright suite
  # with a real browser so both layers are exercised end to end.
  #   - tab layer: /proc scanner on Linux observes the renderer process
  #   - machine layer: "native" leg = built-in /proc sampler (zero user-side
  #     config); "monocart" leg = monocart-reporter JSON as machine source
  smoke-real:
    name: Pre-release smoke (real Playwright)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        flavor: [native, monocart]
    env:
      USE_MONOCART: ${{ matrix.flavor == 'monocart' && '1' || '0' }}
    steps:
      - uses: actions/checkout@v4

      - name: Install smoke project deps
        run: cd test/smoke && npm install

      - name: Install Chromium
        run: cd test/smoke && npx playwright install --with-deps chromium

      # The action spawns run-command from the workspace root; the smoke
      # project's scripts resolve their own paths.
      - name: Run the action around a real browser test
        id: monitor
        uses: ./
        with:
          run-command: npm test --prefix test/smoke
          polling-interval: 1
          # Generous limits: this job asserts that metrics are COLLECTED,
          # not that they breach.
          machine-cpu-threshold: 95
          machine-memory-threshold: 95
          tab-cpu-threshold: 900
          tab-memory-threshold: 95
          monocart-json: test/smoke/monocart-smoke/index.json

      - name: Assert both layers produced data
        run: |
          node -e '
            const t = Number(process.env.TAB_SAMPLES);
            const mem = Number(process.env.MACHINE_MEM_PCT);
            const src = process.env.TAB_SOURCE;
            const machineSrc = process.env.MACHINE_SOURCE;
            const wantMachineSrc = process.env.WANT_MACHINE_SOURCE;
            console.log(`tab-source=${src} tab-sample-count=${t} peak-machine-mem=${mem}% machine-source=${machineSrc}`);
            if (src !== "proc") throw new Error(`expected tab-source=proc, got ${src}`);
            if (t < 1) throw new Error("tab layer produced no samples");
            if (mem <= 0) throw new Error("machine layer produced no samples");
            if (machineSrc !== wantMachineSrc) throw new Error(`expected machine-source=${wantMachineSrc}, got ${machineSrc}`);
            console.log("smoke assertions passed");
          ' || { echo "::error::smoke assertions failed"; exit 1; }
        env:
          TAB_SOURCE: ${{ steps.monitor.outputs.tab-source }}
          TAB_SAMPLES: ${{ steps.monitor.outputs.tab-sample-count }}
          MACHINE_MEM_PCT: ${{ steps.monitor.outputs.peak-machine-memory-percent }}
          MACHINE_SOURCE: ${{ steps.monitor.outputs.machine-source }}
          WANT_MACHINE_SOURCE: ${{ matrix.flavor == 'monocart' && 'monocart' || 'action' }}

      - name: Upload smoke reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: smoke-reports-${{ matrix.flavor }}
          path: |
            test/smoke/monocart-smoke/
            resource-monitor/